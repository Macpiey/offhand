<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>offhand · M1</title>
    <style>
      :root { color-scheme: dark; }
      body { font: 14px/1.5 ui-monospace, monospace; background: #0d1117; color: #e6edf3;
             max-width: 760px; margin: 0 auto; padding: 1rem; display: flex;
             flex-direction: column; height: 100dvh; box-sizing: border-box; }
      #status { font-size: 12px; color: #8b949e; padding-bottom: .5rem; }
      #status .ok { color: #3fb950; } #status .bad { color: #f85149; }
      #transcript { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
      .tool { color: #d29922; } .done { color: #3fb950; } .err { color: #f85149; }
      .run { color: #58a6ff; margin-top: .75rem; }
      .approval { border: 1px solid #d29922; border-radius: 6px; padding: .6rem .8rem; margin: .5rem 0; }
      .approval.high { border-color: #f85149; }
      .approval-buttons { display: flex; gap: .5rem; padding-top: .5rem; }
      .approval-buttons .approve { background: #238636; }
      .approval-buttons .deny { background: #b62324; }
      form, #pair-form { display: flex; gap: .5rem; padding-top: .75rem; }
      #pairing { border: 1px solid #30363d; border-radius: 6px; padding: 0 1rem 1rem; margin-bottom: 1rem; }
      #pairing input { min-width: 0; }
      #enable-push { margin-bottom: .5rem; background: #1f6feb; align-self: flex-start; }
      input { flex: 1; background: #161b22; color: inherit; border: 1px solid #30363d;
              border-radius: 6px; padding: .5rem .75rem; font: inherit; }
      button { background: #238636; color: #fff; border: 0; border-radius: 6px;
               padding: .5rem 1rem; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="status">connecting…</div>
    <div id="pairing" style="display:none">
      <h3>Pair with your daemon</h3>
      <p>Start the daemon with <code>--relay</code> and paste the pairing code it prints:</p>
      <form id="pair-form">
        <input id="pair-relay" placeholder="Relay URL (e.g. https://offhand-relay.onrender.com)" autocomplete="off" />
        <input id="pair-code" placeholder="Pairing code (123456.xxxxx…)" autocomplete="off" />
        <button type="submit">Pair</button>
      </form>
      <p id="pair-error" class="err"></p>
    </div>
    <div id="transcript"></div>
    <form id="form">
      <input id="prompt" placeholder="Prompt the agent…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
