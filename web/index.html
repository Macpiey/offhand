<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>offhand</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="offhand" />
    <style>
      :root { color-scheme: dark; }
      body { font: 14px/1.5 ui-monospace, monospace; background: #0d1117; color: #e6edf3;
             max-width: 760px; margin: 0 auto; display: flex;
             flex-direction: column; height: 100dvh; box-sizing: border-box;
             padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
                      calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left)); }
      #status { font-size: 12px; color: #8b949e; padding-bottom: .5rem; flex: 1; }
      #status .ok { color: #3fb950; } #status .bad { color: #f85149; }
      #topbar { display: flex; align-items: center; gap: .5rem; }
      #settings-btn, #new-session { background: none; border: none; color: #8b949e; font-size: 16px; cursor: pointer; padding: 0 .25rem .5rem; }
      #session-select { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; font: inherit; font-size: 12px; max-width: 40%; margin-bottom: .5rem; }
      .receipt { border: 1px solid #238636; border-radius: 6px; padding: .5rem .8rem; margin: .5rem 0; font-size: 13px; }
      .receipt.fail { border-color: #f85149; }
      .receipt summary { cursor: pointer; color: #8b949e; }
      .receipt pre { overflow-x: auto; font-size: 11px; max-height: 50vh; }
      .receipt img { max-width: 100%; border-radius: 6px; margin-top: .5rem; }
      #settings, #a2hs-hint { border: 1px solid #30363d; border-radius: 6px; padding: .75rem 1rem; margin-bottom: .75rem; }
      #a2hs-hint { border-color: #1f6feb; font-size: 13px; position: relative; }
      #a2hs-hint button { background: none; border: none; color: #8b949e; position: absolute; top: .4rem; right: .4rem; cursor: pointer; }
      #settings dl { font-size: 12px; } #settings dt { color: #8b949e; margin-top: .5rem; } #settings dd { margin: 0; word-break: break-all; }
      #unpair { background: #b62324; margin-top: .75rem; }
      details { margin-top: .5rem; font-size: 12px; color: #8b949e; }
      details input { width: 100%; margin-top: .5rem; box-sizing: border-box; }
      #scan-qr { background: #1f6feb; width: 100%; padding: .75rem; font-size: 15px; }
      #scanner { position: fixed; inset: 0; z-index: 50; background: #000;
                 display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #scanner video { width: 100%; max-height: 80vh; object-fit: cover; }
      #scanner button { position: absolute; bottom: calc(2rem + env(safe-area-inset-bottom));
                        background: #b62324; padding: .75rem 2rem; }
      #transcript { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
      .tool { color: #d29922; } .done { color: #3fb950; } .err { color: #f85149; }
      .run { color: #58a6ff; margin-top: .1rem; }
      .you { color: #e6edf3; background: #161b22; border-radius: 6px; padding: .4rem .6rem; margin-top: .75rem; }
      .approval { border: 1px solid #d29922; border-radius: 6px; padding: .6rem .8rem; margin: .5rem 0; }
      .approval.high { border-color: #f85149; }
      .approval-buttons { display: flex; gap: .5rem; padding-top: .5rem; }
      .approval-buttons .approve { background: #238636; }
      .approval-buttons .deny { background: #b62324; }
      .artifact img { max-width: 100%; border: 1px solid #30363d; border-radius: 6px; margin: .5rem 0; }
      form, #pair-form { display: flex; gap: .5rem; padding-top: .75rem; }
      #pairing { border: 1px solid #30363d; border-radius: 6px; padding: 0 1rem 1rem; margin-bottom: 1rem; }
      #pairing input { min-width: 0; }
      #enable-push { margin-bottom: .5rem; background: #1f6feb; align-self: flex-start; }
      input { flex: 1; background: #161b22; color: inherit; border: 1px solid #30363d;
              border-radius: 6px; padding: .5rem .75rem; font: inherit; }
      button { background: #238636; color: #fff; border: 0; border-radius: 6px;
               padding: .5rem 1rem; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="topbar">
      <div id="status">connecting…</div>
      <select id="session-select" title="Session"></select>
      <button id="new-session" title="New session">＋</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
    <div id="a2hs-hint" style="display:none">
      📲 <strong>Install offhand:</strong> tap <span class="share-icon">Share</span> →
      <strong>Add to Home Screen</strong>. Required for approval notifications on iPhone.
      <button id="a2hs-dismiss">✕</button>
    </div>
    <div id="settings" style="display:none">
      <h3>Settings</h3>
      <dl id="settings-info"></dl>
      <button id="unpair">Unpair this device</button>
    </div>
    <div id="pairing" style="display:none">
      <h3>Pair with your daemon</h3>
      <p>Start the daemon with <code>--relay</code> and scan the QR it prints:</p>
      <button type="button" id="scan-qr">📷 Scan QR code</button>
      <p>…or paste the pairing code:</p>
      <form id="pair-form">
        <input id="pair-code" placeholder="Pairing code (123456.xxxxx…)" autocomplete="off" />
        <button type="submit">Pair</button>
      </form>
      <details>
        <summary>Advanced</summary>
        <input id="pair-relay" placeholder="Relay URL (default: our relay)" autocomplete="off" />
      </details>
      <p id="pair-error" class="err"></p>
    </div>
    <div id="scanner" style="display:none">
      <video id="scan-video" playsinline muted></video>
      <button id="scan-cancel">Cancel</button>
    </div>
    <div id="transcript"></div>
    <form id="form">
      <input id="prompt" placeholder="Prompt the agent…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
