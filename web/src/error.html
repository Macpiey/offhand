<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>offhand</title>
    <style>
      body {
        margin: 0;
        background: #1f1e1c;
        color: #ececea;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        place-items: center;
        height: 100dvh;
        text-align: center;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 2rem; }
      h1 { font: 700 20px/1.2 ui-serif, Georgia, serif; margin: 0; }
      p { color: #9d9a93; margin: 0; font-size: 14px; }
      .spin {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2.5px solid rgba(240,238,230,0.15); border-top-color: #cc6b4d;
        animation: r 0.9s linear infinite; margin-bottom: 0.5rem;
      }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <h1>Updating offhand…</h1>
      <p>Loading the latest version of the app.</p>
    </div>
    <script>
      // A boot failure here almost always means a stale cached shell after a
      // deploy. Retry a few times with backoff; loop-guard via sessionStorage.
      (function () {
        try {
          var attempts = 0, since = 0;
          try {
            var raw = sessionStorage.getItem('offhand-err-recovery');
            if (raw) { var s = JSON.parse(raw); attempts = s.attempts || 0; since = s.since || 0; }
          } catch (e) { /* fresh */ }
          if (Date.now() - since > 90000) { attempts = 0; since = Date.now(); }
          if (attempts < 3) {
            sessionStorage.setItem('offhand-err-recovery', JSON.stringify({ attempts: attempts + 1, since: since }));
            setTimeout(function () {
              location.replace('/?v=' + Date.now());
            }, 400 + 1200 * attempts);
          } else {
            document.querySelector('h1').textContent = 'Something broke';
            document.querySelector('p').textContent = 'Close the app fully and open it again.';
            document.querySelector('.spin').style.display = 'none';
            sessionStorage.removeItem('offhand-err-recovery');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </body>
</html>
